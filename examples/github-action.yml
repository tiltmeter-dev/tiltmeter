# Check your APIs every hour and fail the job on drift.
# Copy this file to .github/workflows/tiltmeter.yml in the repository that holds
# tiltmeter.yaml, and add the secrets your endpoints reference.
name: API drift

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiltmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keeps the baseline in the Actions cache, writes the changes to the job summary and
      # fails on drift. Exit codes: 0 clean, 1 warning, 2 breaking, 3 a check failed, 4 bad
      # config. See https://github.com/tiltmeter-dev/tiltmeter-action for every input.
      - uses: tiltmeter-dev/tiltmeter-action@v1
        with:
          version: "0.1.0"    # the Tiltmeter release this job runs
          fail-on: warning    # or "breaking", or "never" to only report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
