# tiltmeter example: public APIs you can check right away, no keys needed.
#   tiltmeter check -c examples/tiltmeter.yaml
version: 1

endpoints:
  - id: github_repo
    description: Repository metadata from the GitHub REST API (60 requests/hour without a token)
    url: https://api.github.com/repos/langchain-ai/langchain
    headers:
      Accept: application/vnd.github+json

  - id: jsonplaceholder_users
    description: Fake user directory from JSONPlaceholder
    url: https://jsonplaceholder.typicode.com/users

  - id: open_meteo_buenos_aires
    description: Current weather in Buenos Aires from Open-Meteo
    url: https://api.open-meteo.com/v1/forecast
    params:
      latitude: "-34.61"
      longitude: "-58.38"
      current: temperature_2m,wind_speed_10m

  # Credentials come from environment variables and are expanded at request time.
  # They are never written to disk or sent to the LLM.
  #
  # - id: stripe_customers
  #   url: https://api.stripe.com/v1/customers
  #   params:
  #     limit: 10
  #   headers:
  #     Authorization: Bearer ${STRIPE_API_KEY}
  #   ignore_paths:
  #     - $.data[*].metadata          # free-form, changes all the time
  #   severity_overrides:
  #     field_now_optional: warning
  #
  # GraphQL and other POST APIs work too:
  #
  # - id: github_viewer
  #   method: POST
  #   url: https://api.github.com/graphql
  #   headers:
  #     Authorization: Bearer ${GITHUB_TOKEN}
  #   body:
  #     query: "{ viewer { login createdAt } }"

llm:
  enabled: true            # used only when ANTHROPIC_API_KEY is set
  model: claude-haiku-5-5
  effort: low

# `tiltmeter fix <check id> --repo <path>` lets an agent adapt your code and open a pull
# request. The default agent needs ANTHROPIC_API_KEY and `pip install "tiltmeter[fix]"`.
# fix:
#   agent: deepagents        # or claude-code / codex: runs on your own login, no API key
#   model: claude-sonnet-5-5
#   max_model_calls: 40
#   ignore: [".env*", "*.pem", "*.key", "secrets*", ".tiltmeter"]

# Change notices that API providers publish. `tiltmeter notices apply` opens a pull
# request for each one that affects this repository.
# subscriptions:
#   - provider: api.partner.example
#   - openapi: https://raw.githubusercontent.com/acme/api/main/openapi.json  # no notices needed

notify: []
