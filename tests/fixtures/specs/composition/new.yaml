openapi: 3.0.3
info: {title: Payments, version: "2"}
servers: [{url: "https://pay.example"}]
paths:
  /v1/payments/{id}:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Resource"}
                  - type: object
                    required: [amount, method]
                    properties:
                      amount: {type: integer}
                      method:
                        oneOf:
                          - {$ref: "#/components/schemas/Card"}
                          - {$ref: "#/components/schemas/Wallet"}
components:
  schemas:
    Resource:
      type: object
      required: [id, created]
      properties:
        id: {type: string}
        created: {type: integer}
    Card:
      type: object
      required: [kind, last4]
      properties:
        kind: {type: string, enum: [card, card_present]}
        last4: {type: string}
    Wallet:
      type: object
      required: [kind, wallet]
      properties:
        kind: {type: string, enum: [wallet]}
        wallet: {type: string}
