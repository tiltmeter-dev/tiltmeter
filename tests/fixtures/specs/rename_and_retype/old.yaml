openapi: 3.0.3
info: {title: Partner API, version: "2.4"}
servers:
  - url: https://api.partner.example
paths:
  /v1/customers:
    get:
      responses:
        200:
          description: Customers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Customer"}
  /v1/customers/{id}:
    get:
      responses:
        "200":
          description: One customer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
  /v1/legacy:
    get:
      responses:
        "200": {description: ok}
components:
  schemas:
    Customer:
      type: object
      required: [id, phone, balance]
      properties:
        id: {type: integer}
        phone: {type: string}
        balance: {type: integer}
        status: {type: string, enum: [active, past_due]}
        nickname: {type: string}
        referrer: {$ref: "#/components/schemas/Customer"}
