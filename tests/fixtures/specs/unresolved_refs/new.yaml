openapi: 3.0.3
info: {title: Shop, version: "1.1"}
servers: [{url: "https://api.shop.test/v1"}]
paths:
  /orders/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
  /refunds/{id}:
    get:
      responses:
        "200": {$ref: "#/components/responses/Refunds"}
components:
  schemas:
    Order:
      type: object
      required: [id, total, details, refund]
      properties:
        id: {type: string}
        total: {type: string}
        details: {$ref: "#/components/schemas/FoodDetails"}
        phone: {$ref: "https://cdn.shop.test/common.json#PhoneNumber"}
        refund: {$ref: "#/components/schemas/Refunds"}
    FoodDetails:
      type: object
      required: [calories]
      properties:
        calories: {type: integer}
    Refund:
      type: object
      required: [amount]
      properties:
        amount: {type: integer}
