openapi: 3.1.0
info: {title: Orders, version: "2"}
servers: [{url: "https://shop.example/api"}]
paths:
  /orders:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, total, coupon]
                  properties:
                    id: {type: string}
                    total: {type: number}
                    shipped_at: {type: [string, "null"], format: date-time}
                    coupon:
                      anyOf:
                        - {$ref: "#/components/schemas/Coupon"}
                        - {type: "null"}
                    tags: {type: array, items: {type: integer}}
components:
  schemas:
    Coupon:
      type: object
      required: [code]
      properties:
        code: {type: string}
