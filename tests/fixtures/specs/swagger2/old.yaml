swagger: "2.0"
info: {title: Legacy, version: "1"}
host: legacy.example
basePath: /api
schemes: [https]
paths:
  /users:
    post:
      responses:
        200:
          description: created
          schema: {$ref: "#/definitions/User"}
  /users/{id}:
    get:
      responses:
        200:
          description: ok
          schema: {$ref: "#/definitions/User"}
  /ping:
    get:
      responses:
        200: {description: ok, schema: {type: object, properties: {ok: {type: boolean}}}}
definitions:
  User:
    type: object
    required: [id, email]
    properties:
      id: {type: integer}
      email: {type: string}
