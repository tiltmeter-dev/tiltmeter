# Stripe-style "id or expanded object" fields: node_0 to node_11 each point at the next
# three times, so copying every $ref into place would take about 3^12 schemas.
openapi: 3.0.3
info:
  title: Expandable fields
  version: '2026-08-26'
servers:
- url: https://api.ledger.example
paths:
  /v1/nodes/{id}:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/node_0'
  /v1/payments/{id}:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment'
components:
  schemas:
    node_0:
      type: object
      required:
      - id
      - name
      - total
      properties:
        id:
          type: string
        name:
          type: string
        total:
          type: integer
        a:
          anyOf:
          - type: string
            maxLength: 5000
          - $ref: '#/components/schemas/node_1'
        b:
          anyOf:
          - type: string
            maxLength: 5000
          - $ref: '#/components/schemas/node_1'
        c:
          anyOf:
          - type: string
            maxLength: 5000
          - $ref: '#/components/schemas/node_1'
        status:
          type: string
          enum:
          - active
          - past_due
