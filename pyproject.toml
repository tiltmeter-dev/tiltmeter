[project]
name = "tiltmeter"
dynamic = ["version", "readme"]
description = "An early-warning system for the third-party APIs your AI agents depend on: CLI, CI gate and MCP server."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agustin Torres" }]
keywords = [
    "api",
    "schema-drift",
    "json-schema",
    "contract-testing",
    "monitoring",
    "mcp",
    "ai-agents",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "langchain-anthropic>=1.7,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.3.0",
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "rich>=13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/OWNER/tiltmeter"
Documentation = "https://github.com/OWNER/tiltmeter/tree/main/docs"
Changelog = "https://github.com/OWNER/tiltmeter/blob/main/CHANGELOG.md"
Issues = "https://github.com/OWNER/tiltmeter/issues"
Source = "https://github.com/OWNER/tiltmeter"

[project.scripts]
tiltmeter = "tiltmeter.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tiltmeter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tiltmeter"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# PyPI gets the README without the SVG demo and the Mermaid diagram, which it cannot
# render, and with relative links pointing at the repository on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
end-before = "<!-- pypi-skip-image -->"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-after = "<!-- /pypi-skip-image -->"
end-before = "<!-- pypi-skip-diagram -->"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-after = "<!-- /pypi-skip-diagram -->"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/OWNER/tiltmeter/blob/main/\1)'

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "RET", "ASYNC"]
# Box-drawing and arrow characters are intentional in CLI output.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tiltmeter"]

[tool.mypy]
python_version = "3.12"
files = ["src/tiltmeter"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tiltmeter.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: calls real external services and needs API keys (run with -m integration)",
]

[tool.coverage.run]
source = ["tiltmeter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.$"]
